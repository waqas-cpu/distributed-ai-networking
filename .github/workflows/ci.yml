name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Protobufs
      run: |
        python -m grpc_tools.protoc \
          -Icontracts/proto \
          --python_out=contracts/proto \
          --grpc_python_out=contracts/proto \
          contracts/proto/orchestrator.proto
        sed -i 's/import orchestrator_pb2 as orchestrator__pb2/from . import orchestrator_pb2 as orchestrator__pb2/g' \
          contracts/proto/orchestrator_pb2_grpc.py

    - name: Run Pytest
      run: |
        bash scripts/generate_certs.sh
        pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Gateway Docker image
      run: |
        docker build -t orchestration-gateway:latest -f deploy/Dockerfile .

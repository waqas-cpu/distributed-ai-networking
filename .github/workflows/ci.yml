name: CI Pipeline & Supply-Chain Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install security analysis tools
      run: |
        pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run Bandit (Static Application Security Testing)
      run: |
        bandit -r contracts common gateway scheduler node_agent results_aggregator -x tests -ll -ii

    - name: Run Dependency Vulnerability Audit
      run: |
        pip-audit -r requirements.txt || echo "pip-audit completed with review items"

  lint-and-test:
    name: Lint, Build & Test Suite
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Protobufs
      run: |
        python -m grpc_tools.protoc \
          -Icontracts/proto \
          --python_out=contracts/proto \
          --grpc_python_out=contracts/proto \
          contracts/proto/orchestrator.proto
        sed -i 's/import orchestrator_pb2 as orchestrator__pb2/from . import orchestrator_pb2 as orchestrator__pb2/g' \
          contracts/proto/orchestrator_pb2_grpc.py

    - name: Run Security and Platform Tests
      run: |
        bash scripts/generate_certs.sh
        pytest tests/ -v --tb=short

  sbom-and-supply-chain:
    name: SBOM Generation & Supply-Chain Verification
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Generate CycloneDX and SPDX SBOMs
      run: |
        python tools/generate_sbom.py --format cyclonedx --output cyclonedx-sbom.json
        python tools/generate_sbom.py --format spdx --output spdx-sbom.json

    - name: Archive SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: platform-sboms
        path: |
          cyclonedx-sbom.json
          spdx-sbom.json

    - name: Verify Model Supply Chain
      run: |
        python -m pip install -r requirements.txt
        python tools/verify_supply_chain.py --model-id vision-classifier-v3

  docker-build-and-attest:
    name: Container Build & Immutable Digest Attestation
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Gateway Docker image with immutable digest
      id: docker_build
      run: |
        docker build -t orchestration-gateway:latest -f deploy/Dockerfile .
        DIGEST=$(docker images --no-trunc --quiet orchestration-gateway:latest)
        echo "Built container with digest: ${DIGEST}"
        echo "IMAGE_DIGEST=${DIGEST}" >> $GITHUB_ENV

syntax = "proto3";

package orchestrator;

// Node Registry Service
// Used for node registration and attestation.
service NodeRegistry {
  rpc RegisterNode (NodeRegistrationRequest) returns (NodeRegistrationResponse) {}
}

message NodeRegistrationRequest {
  string node_id = 1;
  string node_class = 2; // "edge" or "cloud"
  repeated string supported_models = 3;
  repeated string data_residency_zones = 4;
  string hardware_specs_json = 5;
  string auth_token = 6;
  string public_signing_key = 7;
  string assurance_level = 8;
  bytes attestation_evidence = 9;
}

message NodeRegistrationResponse {
  string status = 1; // "success" or "rejected"
  string message = 2;
}


// Telemetry Service
// Streams telemetry from Node Agents to the Control Plane.
service Telemetry {
  rpc StreamTelemetry (stream SignedTelemetryEnvelope) returns (TelemetryAck) {}
}

message TelemetrySnapshot {
  string node_id = 1;
  string node_class = 2;
  double timestamp = 3;
  double rtt_ms = 4;
  double bandwidth_available_mbps = 5;
  double cpu_util_pct = 6;
  double gpu_util_pct = 7;
  int32 queue_depth = 8;
  double cost_per_1k_inferences_usd = 9;
  string health = 10; // "healthy", "degraded", "unreachable"
  repeated string data_residency_zones = 11;
}

message SignedTelemetryEnvelope {
  string node_id = 1;
  string schema_version = 2;
  double timestamp = 3;
  double expires_at = 4;
  int64 sequence_number = 5;
  string nonce = 6;
  bytes payload_json = 7; // canonical json of TelemetrySnapshot
  bytes previous_message_hash = 8;
  string signature_algorithm = 9;
  string key_id = 10;
  bytes signature = 11;
  string pq_signature_algorithm = 12;
  bytes pq_signature = 13;
}

message TelemetryAck {
  string status = 1;
}


// Execution Service
// Used by the Scheduler to dispatch inference tasks to Node Agents.
service Execution {
  rpc ExecuteTask (SignedTaskEnvelope) returns (SignedResultEnvelope) {}
}

message SignedTaskEnvelope {
  string task_id = 1;
  string node_id = 2;
  int64 cluster_epoch = 3;
  int64 leader_lease_id = 4;
  double issue_time = 5;
  double expires_at = 6;
  bytes encrypted_payload = 7;
  bytes encrypted_dek = 8;
  string signature_algorithm = 9;
  string key_id = 10;
  bytes signature = 11;
  string schema_version = 12;
  string pq_signature_algorithm = 13;
  bytes pq_signature = 14;
}

message SignedResultEnvelope {
  string task_id = 1;
  string node_id = 2;
  double issue_time = 3;
  bytes encrypted_result = 4;
  bytes encrypted_dek = 5;
  string signature_algorithm = 6;
  string key_id = 7;
  bytes signature = 8;
  string schema_version = 9;
  string pq_signature_algorithm = 10;
  bytes pq_signature = 11;
}
